# OBS SCM/CI workflow — rebuild the OBS package when a release tag is pushed.
#
# Live as of 2026-07-29: the GitHub webhook and the OBS workflow token both
# exist, so this file is acted on. It is not inert scaffolding.
#
# WHAT IT DOES
#   trigger_services re-runs the _service that the OBS package ALREADY HOLDS.
#   It does not read this repository. So the version OBS rebuilds is whatever
#   <revision> that stored recipe pins — not whatever tag you just pushed.
#
# WHY THAT IS SAFE HERE
#   packaging/cut-rc.sh promote bumps packaging/obs/_service's <revision> to the
#   tag being published, in the same commit that date-stamps the CHANGELOG,
#   metainfo and debian carriers (ANTS-3728, asserted by the INV-3 block of
#   tests/features/release_rc_pipeline/cut_rc_behaviour_test.sh). The recipe in
#   git therefore always names the tag it shipped alongside.
#
#   The recipe still has to REACH OBS: run packaging/obs/obs-submit.sh after a
#   release. That is what copies the bumped _service across, and committing it
#   already triggers a rebuild — which makes this workflow a belt-and-braces
#   re-trigger rather than the mechanism. Pushing a tag by hand, without either
#   promote or obs-submit.sh, rebuilds the previous release: green, and wrong.
#
# THE FULLY HANDS-OFF ALTERNATIVE
#   OBS's scmsync / SCM-bridge model has OBS watch the git repository directly
#   and sync package sources itself — no _service, no submit step. It needs the
#   package files at a repository root or on a dedicated branch, and ours live
#   under packaging/, so adopting it is a restructure rather than a setting.
#   See https://openbuildservice.org/help/manuals/obs-user-guide/cha-obs-scm-bridge

rebuild_on_tag:
  steps:
    - trigger_services:
        project: home:milnet:ants-terminal
        package: ants-terminal
  filters:
    event: tag_push
