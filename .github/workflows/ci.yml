# Minimal CI: compile-check + run the audit-rule regression suite.
# Runs on push to main and on every PR so regressions to the rule regexes
# are caught before merge.
#
# Hardening notes (matches audit STANDARDS.md §Supply chain):
#   • `permissions: contents: read` — override the overbroad default token.
#   • Third-party actions pinned by 40-char SHA with `# vX.Y.Z` for humans.
#     Tags are mutable; SHAs are not (cf. tj-actions/changed-files, 2025).
#   • No secrets referenced; no `pull_request_target`; no self-hosted runners.
#
# ANTS-1549 speedups (2026-05-18):
#   • ccache via actions/cache — incremental builds skip unchanged TUs.
#   • apt deps cached via cache-apt-pkgs-action — saves apt-get update + dl.
#   • paths-ignore on push trigger — pure docs/roadmap/changelog commits
#     skip CI entirely. PRs always run (safer; merge gate still enforced).

name: CI

on:
  push:
    branches: [main]
    # Docs-only push commits skip CI. PRs always run — the pull_request
    # trigger below has no paths-ignore, so a docs change opened as a PR
    # still gets the full lint gate before merge.
    paths-ignore:
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'PLUGINS.md'
      - 'LICENSE'
      - 'docs/**'
      - '.roadmap-counter'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    # Bumped 15→25 (2026-05-13) as the test corpus crossed the prior
    # cap. Reference: ANTS-1248 finished in 13m38s; ANTS-1254 build
    # cancelled at 15m24s with 269/275 TUs done, so realistic floor is
    # ~17m. 25 leaves headroom for two more feature-test packs without
    # another bump. Runner is the GitHub-hosted ubuntu-24.04 (4 vCPU /
    # 16 GiB) with the in-tree JOB_POOLS cap limiting compile to -j2.
    timeout-minutes: 25
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ANTS-4652 — 500M was thrashing. build-test's own stats step reported
      # `Cache size (GB): 0.5 / 0.5 (99.98%)` with `Cleanups: 14` in ONE run:
      # the cache filled and evicted DURING the build, which is why an 85% hit
      # rate still cost ~500 s of compile. CLAUDE.md records the same trap at
      # the other end — locally, 5 GiB self-evicts on this Qt codebase. The
      # measurement that says whether 2G is enough is the next run's
      # `Cleanups:` line; non-zero means raise it again.
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # ANTS-4773 — no step in this workflow runs git, so the token has no
          # reason to persist into .git/config where an artifact could carry it.
          persist-credentials: false

      - name: Install Qt6 + build + packaging deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # v1.6.1
        with:
          packages: >-
            build-essential cmake ninja-build pkg-config ccache
            qt6-base-dev qt6-base-dev-tools
            libqt6opengl6-dev libqt6openglwidgets6
            liblua5.4-dev cppcheck ripgrep
            appstream desktop-file-utils groff zsh fish
          version: 1.0

      - name: Restore ccache (release)
        # v5.0.5 is the latest actions/cache (checked 2026-06-15). Its bundled
        # restore/save sub-actions still ship a Node-20 runtime, so a Node-20
        # deprecation warning fires here until upstream cuts a Node-24 release;
        # GitHub force-runs these on Node 24 from 2026-06-16, so it self-heals.
        # Bump when actions/cache > v5.0.5 ships.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          # Exact key per-SHA → 100% hit on a re-run of the same commit;
          # restore-keys cascades to the latest release-build cache for
          # incremental compiles on a new SHA.
          key: ${{ runner.os }}-ccache-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-release-

      - name: Configure (Release + ccache compiler launcher)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --zero-stats

      - name: Build
        run: cmake --build build --parallel

      - name: ccache stats (release)
        if: always()
        run: ccache --show-stats

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: "Run cppcheck (audit rule: Qt-aware static analysis)"
        run: |
          cppcheck --enable=all --std=c++20 --library=qt \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppress=unknownMacro \
                   --suppress=normalCheckLevelMaxBranches \
                   --error-exitcode=0 \
                   -I src src/

      # Packaging artefact validation (H2 — distribution readiness).
      # Runs the same validators distro packagers invoke during package
      # review, so schema drift in the desktop entry or AppStream metainfo
      # fails CI instead of landing in a release tarball.
      - name: Validate AppStream metainfo
        run: |
          appstreamcli validate --explain \
            packaging/linux/za.co.antsprojectshub.AntsTerminal.metainfo.xml

      - name: Validate desktop entry
        run: |
          desktop-file-validate packaging/linux/za.co.antsprojectshub.AntsTerminal.desktop

      # Man page lint (H3 — distribution readiness). `-wall` upgrades all
      # groff_man warnings to a non-zero exit so missing macros / broken
      # cross-refs / bad escape sequences fail CI instead of landing in a
      # release tarball.
      - name: Lint ants-terminal.1 with groff
        run: |
          groff -man -Tutf8 -wall packaging/linux/ants-terminal.1 > /dev/null

      # Packaging version-drift gate. Runs the same
      # packaging_version_drift audit rule the AuditDialog surfaces —
      # but here it fails CI when any packaging file disagrees with
      # CMakeLists.txt project(VERSION). Closes the "rule exists but
      # nobody ran it" gap that let 0.6.23 ship with four stale
      # packaging files. Script is the single source of truth;
      # src/auditdialog.cpp invokes the same script.
      - name: Check packaging version drift
        run: bash packaging/check-version-drift.sh

      # Shell completion lint (H4 — distribution readiness). Each shell's
      # parse-only flag (`-n` for bash/zsh, `--no-execute` for fish) catches
      # syntax regressions without running the completion logic, matching
      # the H2 / H3 fail-in-CI-not-in-tarball pattern.
      - name: Lint shell completions (bash / zsh / fish)
        run: |
          bash -n packaging/completions/ants-terminal.bash
          zsh  -n packaging/completions/_ants-terminal
          fish --no-execute packaging/completions/ants-terminal.fish

  # Dedicated ASan + UBSan build. Smoke-tests the binary under sanitizers
  # so initialization-path bugs (config load, command-line parsing, Qt setup)
  # are caught on every push. Runtime coverage today is narrow — `--version`
  # exits before GUI bring-up — but the compile itself validates that no code
  # path is sanitizer-incompatible, and `QT_QPA_PLATFORM=offscreen` means we
  # can broaden later without a display.
  #
  # detect_leaks=0: Qt initializes global singletons with bounded lifetimes
  # that look like leaks to LSan on a fast-exit path. Re-enable once we
  # have a real unit-test suite that does full app lifecycle.
  build-asan:
    runs-on: ubuntu-24.04
    # ANTS-4533 — this cap is a BACKSTOP, not the gate. It must stay above
    # the sum of the per-step `timeout` guards below (24m + 16m), because a
    # job killed by timeout-minutes concludes `cancelled` rather than
    # `failure`: the run does not read as red and nothing notifies. That is
    # how this job went 36-of-40 cancelled over two days unnoticed. The step
    # guards exit 124 and go red; tests/features/ci_asan_budget/ locks the
    # ordering so a later bump cannot quietly undo it.
    timeout-minutes: 42
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # ANTS-4652 — 500M was thrashing. build-test's own stats step reported
      # `Cache size (GB): 0.5 / 0.5 (99.98%)` with `Cleanups: 14` in ONE run:
      # the cache filled and evicted DURING the build, which is why an 85% hit
      # rate still cost ~500 s of compile. CLAUDE.md records the same trap at
      # the other end — locally, 5 GiB self-evicts on this Qt codebase. The
      # measurement that says whether 2G is enough is the next run's
      # `Cleanups:` line; non-zero means raise it again.
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # ANTS-4773 — nothing here runs git.
          persist-credentials: false

      - name: Install Qt6 + build deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # v1.6.1
        with:
          packages: >-
            build-essential cmake ninja-build pkg-config ccache
            qt6-base-dev qt6-base-dev-tools
            libqt6opengl6-dev libqt6openglwidgets6
            liblua5.4-dev ripgrep
          version: 1.0

      - name: Restore ccache (asan)
        # See "Restore ccache (release)" above re: v5.0.5 Node-20 warning.
        # ANTS-4533 — restore/save are SPLIT here, unlike build-test. The
        # combined action saves from an implicit post-step, and that post-step
        # is skipped when the job is cancelled, so every timed-out run left the
        # cache frozen at the last run that completed. Saving explicitly right
        # after the build breaks that spiral.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          # Separate key from release: different compile flags
          # (-fsanitize=address,undefined, -O1, -g) hash to different
          # ccache entries — sharing the release cache would 100% miss.
          key: ${{ runner.os }}-ccache-asan-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-asan-

      - name: Configure (Debug + ASan/UBSan + ccache compiler launcher)
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANTS_SANITIZERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --zero-stats

      - name: Build
        # Guarded rather than left to timeout-minutes: `timeout` exits 124, so
        # an overrun FAILS the step. Measured 11m29s / 11m38s / 12m15s warm,
        # and 16m40s against a cache nine hours stale — 24m is ~1.4x that
        # worst observed case. A genuinely cold build (cache evicted after
        # 7 days) is slower still and SHOULD go red: that is a real signal,
        # not a false alarm.
        run: timeout 24m cmake --build build-asan --parallel

      - name: Save ccache (asan)
        # `always()` is the point of the split: this must survive the overrun
        # it exists to prevent recurring.
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-asan-${{ github.sha }}

      - name: ccache stats (asan)
        if: always()
        run: ccache --show-stats

      - name: Run audit-rule tests under sanitizers
        working-directory: build-asan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # ANTS-4533 — was serial: 922s for 3650 tests on a 4-vCPU runner,
        # dominated by per-process startup under ASan rather than by any one
        # test. -j2 matches the pre-push hook (ANTS-3761) and the workstation
        # preset's caution; --timeout 300 turns a hung test into one failed
        # test instead of the whole budget.
        #
        # MEASURED, first green run: 922s serial -> 704s at -j2. That is
        # 1.31x, not the ~2x a halving would predict, so this suite does not
        # parallelise cleanly and raising -j further is unproven rather than
        # obviously better. The first budget here was 12m and finished with
        # 16s to spare, which is a coin flip rather than a gate; 16m is ~1.4x
        # the measured cost. Re-measure before narrowing it again.
        run: timeout 16m ctest -j2 --output-on-failure --timeout 300

      - name: Smoke-test binary init paths
        working-directory: build-asan
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./ants-terminal --version
          ./ants-terminal --help

  # B1 (docs/standards/ci-build.md) — compile-guard on the RELEASE
  # baseline. release.yml builds the AppImage on ubuntu-22.04 / Qt 6.2.x
  # (qt6-base-dev unpinned from apt);
  # the build-test job above runs on ubuntu-24.04 / newer Qt, so a
  # baseline-only compile error (e.g. a Qt 6.10+ API leaking into a test)
  # is invisible to it and only surfaces at release time. This job
  # compiles everything the release build compiles, on the same image +
  # Qt, so such an error fails the push instead of the release tag
  # (ANTS-1977/1978). Keep the runner + Qt apt set in lockstep with
  # release.yml's install step.
  qt62-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # ANTS-4652 — this job had no compile cache at all and rebuilt the whole
    # tree from scratch every run: 1281 s measured, the second-longest job and
    # one bad day from becoming the critical path. Its own cache key, because
    # Qt 6.2 headers hash to different ccache entries than the 6.4+ the other
    # jobs build against — sharing either would miss 100%.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # ANTS-4773 — nothing here runs git.
          persist-credentials: false

      - name: Install Qt6 + build deps (release baseline)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            libqt6opengl6-dev libqt6openglwidgets6 \
            qt6-wayland qt6-wayland-dev \
            liblua5.4-dev \
            libgl-dev libglx-dev libegl-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Restore ccache (qt62)
        # Split restore/save, per ANTS-4533's finding on build-asan: the
        # combined action saves from an implicit post-step that is SKIPPED on
        # cancellation, so a timed-out run leaves the cache frozen at the last
        # run that completed.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-qt62-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-qt62-

      - name: Configure (Release, tests ON)
        run: |
          cmake -S . -B build-qt62 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --zero-stats

      - name: Build everything (compile guard — no ctest)
        # Compiles the app + every test TU on Qt 6.2; running the suite
        # is the build-test job's responsibility. A baseline-only compile
        # error (find_sources-class) fails here, not at the release tag.
        run: cmake --build build-qt62 --parallel

      - name: Save ccache (qt62)
        # always(): must survive the overrun it exists to prevent recurring.
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-qt62-${{ github.sha }}

      - name: ccache stats (qt62)
        if: always()
        run: ccache --show-stats
