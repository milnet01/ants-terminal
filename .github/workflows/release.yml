# Release artefacts — builds an x86_64 AppImage on every `vX.Y.Z` tag push
# and creates the GitHub release with it attached. Also exposes a manual
# `workflow_dispatch` so an existing release can be given its binary again
# on demand.
#
# Why AppImage: single-file portable executable, runs on any glibc-2.35+
# distro, no install dance, no Qt-version conflicts. Ubuntu 22.04 was
# picked for the runner because its glibc is 2.35 — that covers Debian
# 12, Ubuntu 22.04+, Fedora 36+, openSUSE Tumbleweed, and Arch as of
# 2024+. Using ubuntu-24.04 would lock the AppImage to glibc 2.39,
# excluding still-supported LTS distros.
#
# Hardening matches .github/workflows/ci.yml:
#   • permissions overridden — `contents: write` is needed only for
#     `gh release upload`. No `pull_request_target`, no self-hosted
#     runners, no third-party secrets.
#   • actions/* pinned by 40-char SHA with version tag for humans.
#   • linuxdeploy is downloaded from its `continuous` channel — it does
#     not cut tagged releases. Pinning to SHA via curl is impractical;
#     we accept the supply-chain risk in exchange for upstream bug fixes
#     (Qt6.x autodetection has improved several times). The downloaded
#     binary is checksummed against the GitHub-served checksum file so
#     a swapped artefact still fails fast.
#   • The AppImage is smoke-tested (`--version`, `--help`) before upload.

name: Release artefacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.7.42). Required for manual runs.'
        required: true
        default: ''

# ANTS-4795 — the workflow default is read; `contents: write` is granted on
# the one job that needs it (creating the release and uploading the
# AppImage). Declared here it would be inherited by any job added later,
# which is a write grant nobody decided to make. Mirrors ci.yml.
permissions:
  contents: read

jobs:
  appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # ANTS-4583 — was 25, which is what silently lost the v0.7.105
    # AppImage: that run died at 25m19s and GitHub reports a timed-out
    # job as "cancelled", so the release page was created by the tag and
    # simply never received a binary. The budget was never generous —
    # the v0.7.106-rc1 build the same day took 22m36s, under two and a
    # half minutes of headroom — so any slow apt mirror tipped it over,
    # and it timed out inside the very first step (installing Qt6).
    # Sized now against the SLOWEST observed run rather than the fastest.
    timeout-minutes: 60

    steps:
      - name: Resolve target tag
        id: tag
        # ANTS-4772 — the workflow_dispatch input reaches the shell through
        # env:, never by ${{ }} interpolation into the script body. The
        # template engine expands ${{ }} before the shell parses the line, so
        # a crafted tag would otherwise become shell source in a runner
        # holding contents: write.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            REF="$INPUT_TAG"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading `v` for the version string used in the
          # AppImage filename ("v0.7.42" → "0.7.42").
          VERSION="${REF#v}"
          # ANTS-5577: every release is a full public release, tagged
          # vX.Y.Z and nothing else. Anything this workflow builds becomes
          # the public "latest" download and the target of every self-update,
          # so a tag of any other shape is refused here rather than shipped.
          if ! printf '%s' "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${REF}' is not a release tag (vX.Y.Z); nothing is built."
            exit 1
          fi
          {
            echo "ref=${REF}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${REF} (version ${VERSION})"

      - name: Check out source at tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ steps.tag.outputs.ref }}
          # ANTS-4773 — nothing here runs git; don't leave the token in
          # .git/config where an uploaded artifact could carry it.
          persist-credentials: false

      - name: Install Qt6 + build deps
        # Ubuntu 22.04's qt6-base-dev does NOT pull libgl-dev /
        # libfontconfig1-dev / libxkbcommon-dev as transitive
        # dependencies — they show up via find_dependency(...) inside
        # Qt6GuiConfig.cmake at configure time. Without them, CMake
        # reports "Failed to find Qt component 'Gui'" even though the
        # *.cmake file is on disk. Listing them explicitly is the
        # standard workaround for Qt6 + Ubuntu 22.04 AppImage builds.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            libqt6opengl6-dev libqt6openglwidgets6 \
            qt6-wayland qt6-wayland-dev \
            liblua5.4-dev \
            libsodium-dev \
            libgl-dev libglx-dev libegl-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-util-dev \
            libxcb-xkb-dev libxkbfile-dev \
            libdbus-1-dev libwayland-dev \
            libfuse2 file desktop-file-utils patchelf

      - name: Configure (Release, /usr prefix for AppDir staging)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DANTS_REQUIRE_SELF_UPDATE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install tree into AppDir/usr
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          echo '--- AppDir contents:'
          find AppDir -maxdepth 4 -type f | sort
          # linuxdeploy-plugin-qt expects the .desktop file to declare
          # an icon name that is also discoverable in the AppDir's icon
          # search path. Our installed icon names follow the
          # `ants-terminal-<size>.png` pattern, but the .desktop's
          # `Icon=ants-terminal` line does not include a size. Provide
          # a top-level `ants-terminal.png` symlink to the 256px icon
          # so AppImage clients display a thumbnail in file managers.
          cp AppDir/usr/share/icons/hicolor/256x256/apps/ants-terminal.png \
             AppDir/ants-terminal.png
          # Some AppImage launchers also look for a top-level .desktop;
          # linuxdeploy will populate this from the installed copy.

      - name: Download linuxdeploy + Qt plugin (continuous channel)
        run: |
          # linuxdeploy does not cut tagged releases and does not ship
          # checksum files alongside the `continuous` AppImage (only a
          # `.zsync` file is published). The supply-chain trade-off: a
          # malicious push to linuxdeploy/linuxdeploy or
          # linuxdeploy-plugin-qt could ship a backdoor that lands in
          # our AppImage. Mitigations in lieu of checksums:
          #   • the AppImage is smoke-tested below — a binary that
          #     fails to print --version on a clean Ubuntu 22.04 runner
          #     would fail CI before upload;
          #   • this workflow runs only on tag push or manual
          #     dispatch, not on PRs from forks, so an attacker cannot
          #     trigger it without write access to the repo.
          # If linuxdeploy starts publishing tagged releases with
          # checksums, switch to those and verify here.
          curl -fsSL --retry 3 --retry-delay 5 -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL --retry 3 --retry-delay 5 -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Build AppImage
        env:
          # linuxdeploy-plugin-qt finds Qt6 through QMAKE.
          QMAKE: /usr/lib/qt6/bin/qmake6
          # OUTPUT controls the final AppImage filename.
          OUTPUT: Ants_Terminal-${{ steps.tag.outputs.version }}-x86_64.AppImage
          # linuxdeploy emits noise about already-bundled libs at info
          # level; silence it to keep CI logs scannable.
          NO_STRIP: "1"
          # By default linuxdeploy-plugin-qt bundles only the `xcb`
          # platform plugin. Add `offscreen` so the AppImage can run
          # headless (CI smoke tests, and any user automation hitting
          # `QT_QPA_PLATFORM=offscreen ./Ants_Terminal-*.AppImage`),
          # plus `wayland` so users on a Wayland session land on the
          # native plugin without an XWayland fallback.
          EXTRA_PLATFORM_PLUGINS: "libqoffscreen.so;libqwayland-generic.so"
          # AppImageUpdate / zsync auto-update metadata. linuxdeploy
          # embeds this string into the AppImage's ELF header (via the
          # update-information ELF note) and produces a
          # `<OUTPUT>.zsync` sidecar file alongside the AppImage. The
          # `gh-releases-zsync` schema (documented at
          # docs.appimage.org/packaging-guide/optional/updates.html)
          # tells AppImageUpdate to resolve the wildcard against the
          # owner/repo's GitHub release tagged by the channel field.
          # `latest` is the most recent release, so the metadata is
          # version-stable.
          UPDATE_INFORMATION: "gh-releases-zsync|milnet01|ants-terminal|latest|Ants_Terminal-*-x86_64.AppImage.zsync"
        run: |
          # ANTS-5321 — our own AppRun: `--mcpd` starts the bundled
          # ants-mcpd, anything else starts ants-terminal.
          ./linuxdeploy --appdir AppDir --plugin qt \
            --custom-apprun packaging/appimage/AppRun --output appimage
          ls -la "${OUTPUT}" "${OUTPUT}.zsync"
          file "${OUTPUT}"

      - name: Smoke-test AppImage (--version + --help)
        env:
          OUTPUT: Ants_Terminal-${{ steps.tag.outputs.version }}-x86_64.AppImage
          QT_QPA_PLATFORM: offscreen
        run: |
          # AppImage runs need libfuse2 mounted, OR --appimage-extract-and-run
          # which is the standard CI fallback (no fuse, no kernel modules).
          ./"${OUTPUT}" --appimage-extract-and-run --version
          ./"${OUTPUT}" --appimage-extract-and-run --help
          # ANTS-5321 — the launch switch reaches the bundled MCP helper.
          ./"${OUTPUT}" --appimage-extract-and-run --mcpd --version

      # ANTS-5560 — sign the self-update manifest. The script writes
      # ${OUTPUT}.manifest and ${OUTPUT}.manifest.sig, verifies the signature
      # against the committed public key, and exits non-zero without the
      # secret or on a failed verify, so a release never ships unsigned.
      - name: Sign the update manifest
        env:
          ANTS_UPDATE_SIGNING_KEY: ${{ secrets.ANTS_UPDATE_SIGNING_KEY }}
          OUTPUT: Ants_Terminal-${{ steps.tag.outputs.version }}-x86_64.AppImage
          VERSION: ${{ steps.tag.outputs.version }}
        run: tools/sign-update-manifest.sh "${OUTPUT}" "${VERSION}"

      # ANTS-5577 — this step CREATES the public release, with its files
      # already attached. Given files, the create command makes a draft,
      # uploads them, and only then publishes, so there is never a public
      # release with nothing to download. Until this change the release script
      # created the release at the tag push, about 25 minutes before this job
      # finished: in that window /releases/latest/download/ had nothing to
      # serve and a self-updating AppImage found a release with no file.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: Ants_Terminal-${{ steps.tag.outputs.version }}-x86_64.AppImage
          # ANTS-4792 — `ref` and `version` reach the shell through env:, not
          # by ${{ }} interpolation. ANTS-4772 stopped `inputs.tag` being
          # interpolated directly, but the value it guards is written to
          # $GITHUB_OUTPUT and read back as steps.tag.outputs.ref, so every
          # `${{ ... }}` of it below was the SAME injection one hop further
          # along -- expanded into the script body before any shell sees it,
          # in a job holding contents: write.
          REF: ${{ steps.tag.outputs.ref }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # The AppImage, its `.zsync` sidecar (AppImageUpdate fetches it to
          # download only the changed blocks), and the signed manifest the
          # in-app updater verifies (ANTS-5560).
          #
          # ANTS-4586 — plus a SECOND copy of the AppImage under a
          # version-less name, so a permanent direct-download URL exists:
          #   /releases/latest/download/Ants_Terminal-x86_64.AppImage
          # GitHub's direct form needs an exact filename, and ours embeds the
          # version. The versioned name is unchanged for people who want a
          # specific build, and zsync still keys on it.
          ALIAS="Ants_Terminal-x86_64.AppImage"
          cp "${OUTPUT}" "${ALIAS}"
          UPLOADS=( "${OUTPUT}" "${OUTPUT}.zsync" "${OUTPUT}.manifest" "${OUTPUT}.manifest.sig" "${ALIAS}" )
          if gh release view "$REF" >/dev/null 2>&1; then
            # A manual re-run against a release that already exists: replace
            # its files and leave its text alone.
            gh release upload "$REF" "${UPLOADS[@]}" --clobber
            echo "Uploaded ${UPLOADS[*]} to the existing release ${REF}"
          else
            # The release text is the plain-language lead of this version's
            # CHANGELOG section. The project website shows it as its changelog.
            if ! packaging/release-notes.sh "$VERSION" > release-notes.md; then
              echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${REF}/CHANGELOG.md) for release notes." > release-notes.md
            fi
            gh release create "$REF" \
              --verify-tag \
              --title "$VERSION" \
              --notes-file release-notes.md \
              "${UPLOADS[@]}"
            echo "Created release ${REF} with ${UPLOADS[*]}"
          fi

      # ANTS-4583 — assert the release really carries both artefacts.
      # Uploading and *having uploaded* are different claims, and until
      # this step existed nothing checked the second one: a release with
      # no binary looked identical to a healthy one from the outside, and
      # v0.7.105 sat empty as the public "Latest" download for a day
      # before a user hit it. Fail loudly here instead.
      - name: Verify the release carries its artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: Ants_Terminal-${{ steps.tag.outputs.version }}-x86_64.AppImage
          # ANTS-4792 — `ref` reaches the shell through env:, as above.
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          NAMES=$(gh release view "$REF" \
                    --json assets --jq '.assets[].name')
          echo "Assets now on ${REF}:"
          echo "${NAMES}"
          # ANTS-4586 — the alias is checked for the same reason the others
          # are: an artefact nothing verifies is one that can go missing
          # quietly, and this is the one a published link depends on.
          WANT=( "${OUTPUT}" "${OUTPUT}.zsync" "${OUTPUT}.manifest" "${OUTPUT}.manifest.sig" "Ants_Terminal-x86_64.AppImage" )
          MISSING=0
          for want in "${WANT[@]}"; do
            if ! printf '%s\n' "${NAMES}" | grep -Fxq "${want}"; then
              echo "::error::${want} is NOT attached to the release"
              MISSING=1
            fi
          done
          if [ "${MISSING}" -ne 0 ]; then
            echo "::error::release is missing artefacts"
            exit 1
          fi
          if [ "$(gh release view "$REF" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::release ${REF} is still a draft"
            exit 1
          fi
          echo "Verified: the release is public and every artefact is attached."
