# Release artefacts — builds an x86_64 AppImage on every `v*` tag push
# and uploads it to the matching GitHub release. Also exposes a manual
# `workflow_dispatch` so an existing tag (e.g. one published before this
# workflow existed) can be backfilled with a binary on demand.
#
# Why AppImage: single-file portable executable, runs on any glibc-2.35+
# distro, no install dance, no Qt-version conflicts. Ubuntu 22.04 was
# picked for the runner because its glibc is 2.35 — that covers Debian
# 12, Ubuntu 22.04+, Fedora 36+, openSUSE Tumbleweed, and Arch as of
# 2024+. Using ubuntu-24.04 would lock the AppImage to glibc 2.39,
# excluding still-supported LTS distros.
#
# Hardening matches .github/workflows/ci.yml:
#   • permissions overridden — `contents: write` is needed only for
#     `gh release upload`. No `pull_request_target`, no self-hosted
#     runners, no third-party secrets.
#   • actions/* pinned by 40-char SHA with version tag for humans.
#   • linuxdeploy is downloaded from its `continuous` channel — it does
#     not cut tagged releases. Pinning to SHA via curl is impractical;
#     we accept the supply-chain risk in exchange for upstream bug fixes
#     (Qt6.x autodetection has improved several times). The downloaded
#     binary is checksummed against the GitHub-served checksum file so
#     a swapped artefact still fails fast.
#   • The AppImage is smoke-tested (`--version`, `--help`) before upload.

name: Release artefacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.7.42). Required for manual runs.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Resolve target tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading `v` for the version string used in the
          # AppImage filename ("v0.7.42" → "0.7.42").
          VERSION="${REF#v}"
          # ANTS-1318: detect RC tags (vX.Y.Z-rcN). The RC suffix lives
          # only at the tag level (INV-3), so this regex is the single
          # gate that drives both the AppImage update channel (INV-8)
          # and the GitHub-release prerelease flag (INV-5).
          if printf '%s' "$REF" | grep -qE -- '-rc[0-9]+$'; then
            IS_RC=1
            # INV-8: an RC build's zsync UPDATE_INFORMATION tracks its
            # OWN rc tag, never `latest`. `latest` resolves to the most
            # recent non-prerelease release, so stable users can't be
            # auto-updated onto an RC, and RC testers aren't dragged onto
            # stable. (rc→rc rolling auto-update is deferred — Patron
            # count is 0 today; see ANTS-1318 §2.5 / OQ.)
            UPDATE_CHANNEL="${REF}"
          else
            IS_RC=0
            UPDATE_CHANNEL="latest"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_rc=${IS_RC}" >> "$GITHUB_OUTPUT"
          echo "update_channel=${UPDATE_CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${REF} (version ${VERSION}, is_rc=${IS_RC}, channel=${UPDATE_CHANNEL})"

      - name: Check out source at tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Install Qt6 + build deps
        # Ubuntu 22.04's qt6-base-dev does NOT pull libgl-dev /
        # libfontconfig1-dev / libxkbcommon-dev as transitive
        # dependencies — they show up via find_dependency(...) inside
        # Qt6GuiConfig.cmake at configure time. Without them, CMake
        # reports "Failed to find Qt component 'Gui'" even though the
        # *.cmake file is on disk. Listing them explicitly is the
        # standard workaround for Qt6 + Ubuntu 22.04 AppImage builds.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            libqt6opengl6-dev libqt6openglwidgets6 \
            qt6-wayland qt6-wayland-dev \
            liblua5.4-dev \
            libgl-dev libglx-dev libegl-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-util-dev \
            libxcb-xkb-dev libxkbfile-dev \
            libdbus-1-dev libwayland-dev \
            libfuse2 file desktop-file-utils patchelf

      - name: Configure (Release, /usr prefix for AppDir staging)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install tree into AppDir/usr
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          echo '--- AppDir contents:'
          find AppDir -maxdepth 4 -type f | sort
          # linuxdeploy-plugin-qt expects the .desktop file to declare
          # an icon name that is also discoverable in the AppDir's icon
          # search path. Our installed icon names follow the
          # `ants-terminal-<size>.png` pattern, but the .desktop's
          # `Icon=ants-terminal` line does not include a size. Provide
          # a top-level `ants-terminal.png` symlink to the 256px icon
          # so AppImage clients display a thumbnail in file managers.
          cp AppDir/usr/share/icons/hicolor/256x256/apps/ants-terminal.png \
             AppDir/ants-terminal.png
          # Some AppImage launchers also look for a top-level .desktop;
          # linuxdeploy will populate this from the installed copy.

      - name: Download linuxdeploy + Qt plugin (continuous channel)
        run: |
          # linuxdeploy does not cut tagged releases and does not ship
          # checksum files alongside the `continuous` AppImage (only a
          # `.zsync` file is published). The supply-chain trade-off: a
          # malicious push to linuxdeploy/linuxdeploy or
          # linuxdeploy-plugin-qt could ship a backdoor that lands in
          # our AppImage. Mitigations in lieu of checksums:
          #   • the AppImage is smoke-tested below — a binary that
          #     fails to print --version on a clean Ubuntu 22.04 runner
          #     would fail CI before upload;
          #   • this workflow runs only on tag push or manual
          #     dispatch, not on PRs from forks, so an attacker cannot
          #     trigger it without write access to the repo.
          # If linuxdeploy starts publishing tagged releases with
          # checksums, switch to those and verify here.
          curl -fsSL --retry 3 --retry-delay 5 -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL --retry 3 --retry-delay 5 -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Build AppImage
        env:
          # linuxdeploy-plugin-qt finds Qt6 through QMAKE.
          QMAKE: /usr/lib/qt6/bin/qmake6
          # OUTPUT controls the final AppImage filename.
          OUTPUT: Ants_Terminal-${{ steps.tag.outputs.version }}-x86_64.AppImage
          # linuxdeploy emits noise about already-bundled libs at info
          # level; silence it to keep CI logs scannable.
          NO_STRIP: "1"
          # By default linuxdeploy-plugin-qt bundles only the `xcb`
          # platform plugin. Add `offscreen` so the AppImage can run
          # headless (CI smoke tests, and any user automation hitting
          # `QT_QPA_PLATFORM=offscreen ./Ants_Terminal-*.AppImage`),
          # plus `wayland` so users on a Wayland session land on the
          # native plugin without an XWayland fallback.
          EXTRA_PLATFORM_PLUGINS: "libqoffscreen.so;libqwayland-generic.so"
          # AppImageUpdate / zsync auto-update metadata. linuxdeploy
          # embeds this string into the AppImage's ELF header (via the
          # update-information ELF note) and produces a
          # `<OUTPUT>.zsync` sidecar file alongside the AppImage. The
          # `gh-releases-zsync` schema (documented at
          # docs.appimage.org/packaging-guide/optional/updates.html)
          # tells AppImageUpdate to resolve the wildcard against the
          # owner/repo's GitHub release tagged by the channel field.
          # Stable builds pin `latest` (the most recent non-prerelease
          # release) so the metadata is version-stable. ANTS-1318 INV-8:
          # RC builds substitute their own rc tag here (computed in the
          # Resolve step) so the two update streams never cross.
          UPDATE_INFORMATION: "gh-releases-zsync|milnet01|ants-terminal|${{ steps.tag.outputs.update_channel }}|Ants_Terminal-*-x86_64.AppImage.zsync"
        run: |
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          ls -la "${OUTPUT}" "${OUTPUT}.zsync"
          file "${OUTPUT}"

      - name: Smoke-test AppImage (--version + --help)
        env:
          OUTPUT: Ants_Terminal-${{ steps.tag.outputs.version }}-x86_64.AppImage
          QT_QPA_PLATFORM: offscreen
        run: |
          # AppImage runs need libfuse2 mounted, OR --appimage-extract-and-run
          # which is the standard CI fallback (no fuse, no kernel modules).
          ./"${OUTPUT}" --appimage-extract-and-run --version
          ./"${OUTPUT}" --appimage-extract-and-run --help

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: Ants_Terminal-${{ steps.tag.outputs.version }}-x86_64.AppImage
        run: |
          # Pushing a tag does NOT auto-create a GitHub Release object
          # — `gh release upload` 404s if the Release isn't there yet.
          # `gh release view` returns non-zero on absence; create the
          # Release on demand with the tag as title and an empty body
          # (the user can flesh out the description after; CHANGELOG.md
          # has the full notes already).
          if ! gh release view "${{ steps.tag.outputs.ref }}" >/dev/null 2>&1; then
            # ANTS-1318 INV-5 (defense-in-depth, OQ-4): an RC tag that
            # reaches this auto-create path (e.g. a manual
            # workflow_dispatch that didn't pre-create the release) must
            # still be marked prerelease so it never surfaces as
            # `latest`. cut-rc.sh normally pre-creates the RC release
            # with --prerelease, so this branch is the backstop.
            PRERELEASE_FLAG=""
            if [ "${{ steps.tag.outputs.is_rc }}" = "1" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "${{ steps.tag.outputs.ref }}" \
              $PRERELEASE_FLAG \
              --title "${{ steps.tag.outputs.ref }}" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${{ steps.tag.outputs.ref }}/CHANGELOG.md) for release notes."
            echo "Created GitHub Release ${{ steps.tag.outputs.ref }} (prerelease=${{ steps.tag.outputs.is_rc }})"
          fi
          # Upload both the AppImage AND its `.zsync` sidecar.
          # AppImageUpdate fetches the .zsync to compute partial
          # downloads, so without it embedded clients fall back to
          # whole-file fetch (still works, just slower). With it,
          # only changed blocks transfer.
          gh release upload "${{ steps.tag.outputs.ref }}" \
            "${OUTPUT}" \
            "${OUTPUT}.zsync" \
            --clobber
          echo "Uploaded ${OUTPUT} to release ${{ steps.tag.outputs.ref }}"
