# Type-check config for the helper scripts under tools/.
#
# The project had none, so the type-check row was skipped rather than run:
# an unconfigured mypy on this tree reports missing annotations, which is a
# project decision rather than a defect (ANTS-4791).
#
#   mypy --config-file mypy.ini
#
# Deliberately lenient, and kept that way on measurement. These are
# standalone helper scripts, not a typed library. Enabling the stricter
# flags (check_untyped_defs, warn_unreachable) reports the absence of
# annotations rather than any defect -- it took the count from a handful to
# dozens without surfacing a single real type error.
#
# NOTE: the project's own audit_run verb does NOT auto-detect mypy -- a
# deps-less sweep produces import noise that dominates the raw count
# (ANTS-3418), so it runs only when named. This config does not change that.

[mypy]
files = tools
python_version = 3.11

# These scripts import packages that are not installed as a declared
# dependency set, so unresolved imports are expected and are not findings.
ignore_missing_imports = true

# Off on purpose: see the note above.
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

warn_unused_configs = true
warn_redundant_casts = true

# An untyped lambda passed to re.subn() gives its match parameter type Any,
# and mypy then reports every f-string interpolation of a group as possibly
# formatting bytes. Verified against the source: the patterns and subjects
# are str throughout, so these are false positives rather than defects.
#
# Set globally rather than per-module: these scripts have hyphenated names
# and are not an importable package, so a [mypy-tools.*] section matches
# nothing and mypy reports it as unused.
disable_error_code = str-bytes-safe
