# How the machine-wide pre-push hook runs this repo's gate (ANTS-5542).
# Committed, so every clone gets it; a key in the clone's own git config wins.
[ants "gate"]
	command = ./tools/local-ci.sh
	docsMode = --docs
	# One list: ci.yml's push paths-ignore decides what is documentation.
	docsCommand = python3 tools/ci_workflow.py docs-only
	# Keep the warm build/ tree; refuse a dirty tree rather than cold-build a
	# fresh checkout.
	inPlace = true
	dirtyTree = refuse
